 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d4a78"/><stop offset=".55" stop-color="#5b3bb0"/><stop offset="1" stop-color="#c5f36b"/></linearGradient>
