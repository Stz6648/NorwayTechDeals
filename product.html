<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product details | TechKjop</title><meta name="description" content="Review product details and marketplace listing information on TechKjop.">
<meta name="theme-color" content="#090d17">
<meta name="robots" content="noindex,follow">
<style>
:root{--bg:#0b1020;--panel:#141f31;--line:#293851;--text:#f4f7fb;--muted:#a6b4c7;--lime:#c5f36b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit;text-decoration:none}.shell{max-width:1120px;margin:auto;padding:0 22px}
header{border-bottom:1px solid #ffffff16;background:#090d17}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:900;letter-spacing:-1px}.logo span{color:var(--lime)}.back{color:#b8c6d8;font-size:13px}
main{padding:42px 0 70px}.crumb{font-size:12px;color:#94a5bb;margin-bottom:22px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}.visual{background:#f4f6f8;border-radius:16px;min-height:430px;display:flex;align-items:center;justify-content:center;overflow:hidden}.visual img{width:100%;height:430px;object-fit:contain;padding:22px}.panel{background:linear-gradient(145deg,#17243a,#111a29);border:1px solid var(--line);border-radius:16px;padding:28px}.category{font-size:11px;letter-spacing:1.2px;color:var(--lime);font-weight:900;text-transform:uppercase}.condition{display:inline-block;margin:14px 0 8px;padding:7px 10px;border:1px solid #3b526b;border-radius:6px;color:#d5e0ee;font-size:11px}.title{font-size:30px;line-height:1.2;letter-spacing:-.8px;margin:10px 0 15px}.desc{color:var(--muted);font-size:14px;line-height:1.7}.pricebox{margin:24px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.price{font-size:30px;font-weight:900}.converted{font-size:13px;color:#a8b8cc;margin-top:5px}.cta{display:block;text-align:center;background:var(--lime);color:#111827;font-weight:900;padding:15px;border-radius:9px;margin-top:20px}.cta:hover{background:#d9ff91}.reviewFlag{margin:12px 0;padding:10px 12px;border-radius:8px;background:#4b321a;color:#ffd99b;font-size:12px;line-height:1.5;font-weight:800}.note{font-size:12px;line-height:1.7;color:#9eafc3;margin-top:20px}.disclosure{margin-top:24px;background:#111a2a;border:1px solid var(--line);border-radius:12px;padding:18px;color:#a9b7c9;font-size:12px;line-height:1.7}.error{padding:60px 20px;text-align:center;color:var(--muted)}footer{padding:25px 0;border-top:1px solid #ffffff16;color:#8392a7;font-size:12px}
@media(max-width:760px){.layout{grid-template-columns:1fr;gap:18px}.visual{min-height:290px}.visual img{height:290px}.panel{padding:21px}.title{font-size:25px}main{padding-top:26px}}
</style></head><body>
<header><div class="shell nav"><a class="logo" href="/">Tech<span>Kjop</span></a><a class="back" href="/">← Back to products</a></div></header>
<main class="shell"><div class="crumb"><a href="/">Home</a> / Product details</div><div id="product"><div class="error">Loading product details…</div></div></main>
<footer><div class="shell">© 2026 TechKjop · Independent technology discovery and affiliate website.</div></footer>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){const box=document.getElementById("product");const id=new URLSearchParams(location.search).get("id");if(!id){box.innerHTML='<div class="error">Product not found. <a href="/">Return to TechKjop</a></div>';return}
try{const r=await fetch("/products.json",{cache:"no-store"});if(!r.ok)throw Error("catalogue unavailable");const ps=await r.json();const p=ps.find(x=>String(x.id)===id);if(!p)throw Error("product not found");const o=(p.offers||[]).find(x=>x.affiliate===true&&x.url&&x.url.includes("campid=")&&Number(x.price)>0);if(!o)throw Error("offer unavailable");
let nok=null;try{if(o.currency==="USD"){const fx=await fetch("https://open.er-api.com/v6/latest/USD");const f=await fx.json();if(f.result==="success"&&Number(f.rates?.NOK)>0)nok=Number(o.price)*Number(f.rates.NOK)}}catch(_){}
const price=Number(o.price).toLocaleString("en-US",{style:"currency",currency:o.currency||"USD"});const review=p.priceReview?'<div class="reviewFlag">Price check recommended: this listing is unusually high for its category. Compare the exact model and condition before buying.</div>':"";
document.title=p.name+" | TechKjop";
box.innerHTML='<div class="layout"><div class="visual"><img src="'+esc(p.image)+'" alt="'+esc(p.name)+'"></div><section class="panel"><div class="category">'+esc(p.category||"Tech product")+' · eBay US marketplace</div><div class="condition">'+esc(o.condition||"Check condition on eBay")+'</div><h1 class="title">'+esc(p.name)+'</h1>'+review+'<p class="desc">'+esc(p.description||"Review the seller listing for full product specifications and included accessories.")+'</p><div class="pricebox"><div class="price">'+price+'</div><div class="converted">'+(nok!==null?"Indicative NOK currency conversion only: "+esc(nok.toLocaleString("nb-NO",{style:"currency",currency:"NOK",maximumFractionDigits:0}))+" · not a Norwegian retail price; excludes delivery and taxes":"Price shown by marketplace seller")+'</div></div><a class="cta" href="'+esc(o.url)+'" target="_blank" rel="nofollow sponsored noopener">Check seller listing on eBay ↗</a><p class="note">This is an eBay US marketplace listing priced in USD. Shipping to Norway has not been verified. Before ordering, confirm the exact item condition, seller feedback, delivery cost, VAT/import charges, return terms and final checkout total. Any NOK figure is only a currency conversion, not a local Norwegian retail price.</p></section></div><div class="disclosure"><strong>Affiliate disclosure:</strong> TechKjop may earn a commission from qualifying purchases made through selected links, at no extra cost to you. TechKjop is not the seller and does not control marketplace listings.</div>';
}catch(e){box.innerHTML='<div class="error">This listing is not available right now. <a href="/">Return to TechKjop</a></div>'}}
load();
</script></body></html>
