<script>
async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const container = document.getElementById("product");

  if (!id) {
    container.innerHTML =
      "<div class='product'><h1>Product not found</h1></div>";
    return;
  }

  try {
    const response = await fetch("/products.json?" + Date.now());
    const products = await response.json();

    const product = products.find(
      p => String(p.id) === String(id)
    );

    if (!product) {
      container.innerHTML =
        "<div class='product'><h1>Product not found</h1></div>";
      return;
    }

    document.title =
      product.name + " - TechKjop";

    const specs =
      product.specifications || {};

    const offers =
      Array.isArray(product.offers)
        ? product.offers
        : [];

    /* USD → NOK */
    let usdToNok = 9.44;

    try {
      const usdRateResponse =
        await fetch(
          "https://open.er-api.com/v6/latest/USD"
        );

      const usdRateData =
        await usdRateResponse.json();

      const liveRate =
        Number(
          usdRateData?.rates?.NOK
        );

      if (liveRate > 0) {
        usdToNok = liveRate;
      }

    } catch (e) {
      console.log(
        "USD rate failed, using 9.44"
      );
    }

    /*
      Convert offer price to NOK.
      eBay is always treated as USD.
    */
    function getOfferNok(offer) {

      const price =
        Number(offer?.price || 0);

      if (
        !Number.isFinite(price) ||
        price <= 0
      ) {
        return 0;
      }

      const store =
        String(
          offer?.store || ""
        ).toLowerCase();

      const currency =
        String(
          offer?.currency || ""
        ).toUpperCase();

      const isEbay =
        store.includes("ebay");

      const isUSD =
        currency === "USD";

      if (isEbay || isUSD) {
        return price * usdToNok;
      }

      return price;
    }

    /*
      Valid offers
    */
    const validOffers =
      offers.filter(offer =>
        offer &&
        Number.isFinite(
          Number(offer.price)
        ) &&
        Number(offer.price) > 0
      );

    /*
      Calculate TOP price
    */
    let lowestPrice = 0;

    if (validOffers.length > 0) {

      lowestPrice =
        Math.min(
          ...validOffers.map(
            offer =>
              getOfferNok(offer)
          )
        );

    } else {

      const rawLowest =
        Number(
          product.lowestPrice || 0
        );

      const lowestStore =
        String(
          product.lowestStore || ""
        ).toLowerCase();

      const lowestCurrency =
        String(
          product.currency || ""
        ).toUpperCase();

      if (
        lowestStore.includes("ebay") ||
        lowestCurrency === "USD"
      ) {
        lowestPrice =
          rawLowest * usdToNok;
      } else {
        lowestPrice =
          rawLowest;
      }
    }

    container.innerHTML = `
      <section class="product">

        <div class="product-top">

          <div>
            <img
              class="product-image"
              src="${
                product.image ||
                "/images/techkjop-placeholder.jpg"
              }"
              alt="${product.name}"
            >
          </div>

          <div>

            <div class="brand">
              ${product.brand || ""}
            </div>

            <h1>
              ${product.name}
            </h1>

            <p>
              ${product.description || ""}
            </p>

            ${
              lowestPrice > 0
                ? `
                  <div class="price">
                    From
                    ${lowestPrice.toLocaleString(
                      "no-NO",
                      {
                        maximumFractionDigits: 0
                      }
                    )}
                    kr
                  </div>
                `
                : `
                  <div class="price">
                    Price not available
                  </div>
                `
            }

            <div class="specs">

              ${
                specs.cpu
                  ? `
                    <div class="spec">
                      <strong>CPU</strong><br>
                      ${specs.cpu}
                    </div>
                  `
                  : ""
              }

              ${
                specs.gpu
                  ? `
                    <div class="spec">
                      <strong>GPU</strong><br>
                      ${specs.gpu}
                    </div>
                  `
                  : ""
              }

              ${
                specs.ram
                  ? `
                    <div class="spec">
                      <strong>RAM</strong><br>
                      ${specs.ram}
                    </div>
                  `
                  : ""
              }

              ${
                specs.storage
                  ? `
                    <div class="spec">
                      <strong>Storage</strong><br>
                      ${specs.storage}
                    </div>
                  `
                  : ""
              }

              ${
                specs.screen
                  ? `
                    <div class="spec">
                      <strong>Screen</strong><br>
                      ${specs.screen}
                    </div>
                  `
                  : ""
              }

              ${
                specs.vram
                  ? `
                    <div class="spec">
                      <strong>VRAM</strong><br>
                      ${specs.vram}
                    </div>
                  `
                  : ""
              }

            </div>

          </div>

        </div>

      </section>

      <section class="product offers">

        <h2>Compare prices</h2>

        ${
          offers.length

            ? offers.map(o => {

                const rawPrice =
                  Number(o.price || 0);

                const store =
                  String(
                    o.store || ""
                  ).toLowerCase();

                const currency =
                  String(
                    o.currency || ""
                  ).toUpperCase();

                const isEbay =
                  store.includes("ebay");

                const isUSD =
                  currency === "USD";

                const nokPrice =
                  getOfferNok(o);

                let priceHTML = "";

                if (
                  isEbay ||
                  isUSD
                ) {

                  priceHTML = `
                    ${rawPrice.toLocaleString(
                      "en-US",
                      {
                        maximumFractionDigits: 2
                      }
                    )}
                    USD
                    ≈
                    ${nokPrice.toLocaleString(
                      "no-NO",
                      {
                        maximumFractionDigits: 0
                      }
                    )}
                    NOK
                  `;

                } else {

                  priceHTML = `
                    ${nokPrice.toLocaleString(
                      "no-NO",
                      {
                        maximumFractionDigits: 0
                      }
                    )}
                    NOK
                  `;
                }

                return `
                  <div class="offer">

                    <div>

                      <div class="store">
                        ${o.store || "Store"}
                      </div>

                      <div>
                        ${
                          o.condition ||
                          "New"
                        }
                        ·
                        ${
                          o.country || ""
                        }
                      </div>

                    </div>

                    <div class="offer-price">
                      ${priceHTML}
                    </div>

                    ${
                      o.url
                        ? `
                          <a
                            class="deal-button"
                            href="${o.url}"
                            target="_blank"
                            rel="noopener"
                          >
                            View deal
                          </a>
                        `
                        : ""
                    }

                  </div>
                `;

              }).join("")

            : `
              <div class="empty">
                No prices available yet.
              </div>
            `
        }

      </section>
    `;

  } catch (error) {

    console.error(error);

    container.innerHTML =
      "<div class='product'><h1>Unable to load product</h1></div>";
  }
}

loadProduct();
</script>
