<script>
async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const container = document.getElementById("product");

  if (!id) {
    container.innerHTML =
      "<div class='product'><h1>Product not found</h1></div>";
    return;
  }

  try {
    const response = await fetch("/products.json?" + Date.now());
    const products = await response.json();

    const product = products.find(p => String(p.id) === String(id));

    if (!product) {
      container.innerHTML =
        "<div class='product'><h1>Product not found</h1></div>";
      return;
    }

    document.title = product.name + " - TechKjop";

    const specs = product.specifications || {};

    const offers = Array.isArray(product.offers)
      ? product.offers
      : [];

    /* USD → NOK */
    let usdToNok = 9.44;

    try {
      const usdRateResponse = await fetch(
        "https://open.er-api.com/v6/latest/USD"
      );

      const usdRateData =
        await usdRateResponse.json();

      if (
        usdRateData &&
        usdRateData.rates &&
        Number(usdRateData.rates.NOK) > 0
      ) {
        usdToNok = Number(
          usdRateData.rates.NOK
        );
      }
    } catch (e) {
      console.log(
        "USD rate failed, using 9.44"
      );
    }

    /* Convert one offer to NOK */
    function getOfferNok(offer) {
      const price = Number(offer?.price || 0);

      if (!price) return 0;

      const currency =
        String(
          offer?.currency || ""
        ).toUpperCase();

      if (currency === "USD") {
        return price * usdToNok;
      }

      return price;
    }

    /* Valid offers */
    const validOffers = offers.filter(
      offer =>
        offer &&
        Number.isFinite(
          Number(offer.price)
        ) &&
        Number(offer.price) > 0
    );

    /*
      Calculate top price in NOK
    */
    let lowestPrice = 0;

    if (validOffers.length > 0) {
      lowestPrice = Math.min(
        ...validOffers.map(
          getOfferNok
        )
      );
    } else {
      /*
        If offers are missing, use
        product.lowestPrice.

        eBay lowestPrice is stored
        as USD, so convert it.
      */
      const rawLowest =
        Number(
          product.lowestPrice || 0
        );

      const lowestStore =
        String(
          product.lowestStore || ""
        ).toLowerCase();

      if (
        lowestStore === "ebay"
      ) {
        lowestPrice =
          rawLowest * usdToNok;
      } else {
        lowestPrice =
          rawLowest;
      }
    }

    container.innerHTML = `
      <section class="product">
        <div class="product-top">

          <div>
            <img
              class="product-image"
              src="${
                product.image ||
                "/images/techkjop-placeholder.jpg"
              }"
              alt="${product.name}"
            >
          </div>

          <div>
            <div class="brand">
              ${product.brand || ""}
            </div>

            <h1>
              ${product.name}
            </h1>

            <p>
              ${product.description || ""}
            </p>

            ${
              lowestPrice > 0
                ? `
                  <div class="price">
                    From
                    ${lowestPrice.toLocaleString(
                      "no-NO",
                      {
                        maximumFractionDigits: 0
                      }
                    )}
                    kr
                  </div>
                `
                : `
                  <div class="price">
                    Price not available
                  </div>
                `
            }

            <div class="specs">

              ${
                specs.cpu
                  ? `
                    <div class="spec">
                      <strong>CPU</strong><br>
                      ${specs.cpu}
                    </div>
                  `
                  : ""
              }

              ${
                specs.gpu
                  ? `
                    <div class="spec">
                      <strong>GPU</strong><br>
                      ${specs.gpu}
                    </div>
                  `
                  : ""
              }

              ${
                specs.ram
                  ? `
                    <div class="spec">
                      <strong>RAM</strong><br>
                      ${specs.ram}
                    </div>
                  `
                  : ""
              }

              ${
                specs.storage
                  ? `
                    <div class="spec">
                      <strong>Storage</strong><br>
                      ${specs.storage}
                    </div>
                  `
                  : ""
              }

              ${
                specs.screen
                  ? `
                    <div class="spec">
                      <strong>Screen</strong><br>
                      ${specs.screen}
                    </div>
                  `
                  : ""
              }

              ${
                specs.vram
                  ? `
                    <div class="spec">
                      <strong>VRAM</strong><br>
                      ${specs.vram}
                    </div>
                  `
                  : ""
              }

            </div>
          </div>

        </div>
      </section>

      <section class="product offers">

        <h2>Compare prices</h2>

        ${
          offers.length
            ? offers
                .map(o => {

                  const rawPrice =
                    Number(
                      o.price || 0
                    );

                  const currency =
                    String(
                      o.currency || ""
                    ).toUpperCase();

                  const isUSD =
                    currency === "USD";

                  const nokPrice =
                    getOfferNok(o);

                  let priceHTML = "";

                  if (isUSD) {
                    priceHTML = `
                      ${rawPrice.toLocaleString(
                        "en-US",
                        {
                          minimumFractionDigits:
                            rawPrice % 1 === 0
                              ? 0
                              : 2,
                          maximumFractionDigits: 2
                        }
                      )}
                      USD
                      ≈
                      ${nokPrice.toLocaleString(
                        "no-NO",
                        {
                          maximumFractionDigits: 0
                        }
                      )}
                      NOK
                    `;
                  } else {
                    priceHTML = `
                      ${nokPrice.toLocaleString(
                        "no-NO",
                        {
                          maximumFractionDigits: 0
                        }
                      )}
                      NOK
                    `;
                  }

                  return `
                    <div class="offer">

                      <div>
                        <div class="store">
                          ${o.store || "Store"}
                        </div>

                        <div>
                          ${
                            o.condition ||
                            "New"
                          }
                          ·
                          ${
                            o.country || ""
                          }
                        </div>
                      </div>

                      <div class="offer-price">
                        ${priceHTML}
                      </div>

                      ${
                        o.url
                          ? `
                            <a
                              class="deal-button"
                              href="${o.url}"
                              target="_blank"
                              rel="noopener"
                            >
                              View deal
                            </a>
                          `
                          : ""
                      }

                    </div>
                  `;
                })
                .join("")
            : `
              <div class="empty">
                No prices available yet.
              </div>
            `
        }

      </section>
    `;

  } catch (error) {

    console.error(error);

    container.innerHTML =
      "<div class='product'><h1>Unable to load product</h1></div>";
  }
}

loadProduct();
</script>
