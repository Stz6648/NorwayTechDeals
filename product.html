<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product comparison | TechKjop</title>
<meta name="description" content="Compare tracked marketplace offers, seller condition and delivery information on TechKjop.">
<meta name="theme-color" content="#090d17"><meta name="robots" content="noindex,follow">
<style>
:root{--bg:#0b1020;--panel:#141f31;--line:#293851;--text:#f4f7fb;--muted:#a6b4c7;--lime:#c5f36b;--cyan:#65d9e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}.shell{max-width:1120px;margin:auto;padding:0 22px}
header{border-bottom:1px solid #ffffff16;background:#090d17}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:900;letter-spacing:-1px}.logo span{color:var(--lime)}.back{color:#b8c6d8;font-size:13px}
main{padding:38px 0 70px}.crumb{font-size:12px;color:#94a5bb;margin-bottom:22px}.layout{display:grid;grid-template-columns:.95fr 1.05fr;gap:30px;align-items:start}.visual{background:#f4f6f8;border-radius:16px;min-height:400px;display:flex;align-items:center;justify-content:center;overflow:hidden}.visual img{width:100%;height:400px;object-fit:contain;padding:22px}.panel{background:linear-gradient(145deg,#17243a,#111a29);border:1px solid var(--line);border-radius:16px;padding:26px}.category{font-size:11px;letter-spacing:1.2px;color:var(--lime);font-weight:900;text-transform:uppercase}.condition{display:inline-block;margin:14px 0 8px;padding:7px 10px;border:1px solid #3b526b;border-radius:6px;color:#d5e0ee;font-size:11px}.title{font-size:29px;line-height:1.2;letter-spacing:-.8px;margin:10px 0 15px}.desc{color:var(--muted);font-size:14px;line-height:1.7}.reviewFlag{margin:14px 0;padding:11px 13px;border-radius:8px;background:#4b321a;color:#ffd99b;font-size:12px;line-height:1.5;font-weight:800}.bestPrice{margin:22px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.bestPrice small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}.bestPrice strong{display:block;font-size:29px;margin-top:6px}.bestPrice span{display:block;color:#a8b8cc;font-size:12px;margin-top:5px}.offers{display:grid;gap:12px;margin-top:16px}.offer{border:1px solid var(--line);background:#101a2a;border-radius:12px;padding:17px}.offerTop{display:flex;align-items:start;justify-content:space-between;gap:14px}.merchant{font-size:15px;font-weight:900}.price{font-size:20px;font-weight:900;text-align:right}.converted{font-size:11px;color:#9fb1c7;text-align:right;margin-top:3px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.pill{font-size:10px;color:#d4e0ef;border:1px solid #3a4d66;padding:5px 7px;border-radius:20px}.shipping{font-size:11px;color:#a7b6c9;line-height:1.55}.cta{display:block;text-align:center;background:var(--lime);color:#111827;font-weight:900;padding:12px;border-radius:8px;margin-top:13px;font-size:12px}.cta:hover{background:#d9ff91}.history{margin-top:28px;background:#111a2a;border:1px solid var(--line);border-radius:13px;padding:19px}.history h2{font-size:18px;margin:0 0 8px}.history p{font-size:12px;line-height:1.6;color:var(--muted)}.historyChart{width:100%;height:auto;display:block;margin-top:10px}.historyLegend{display:flex;justify-content:space-between;color:#9fb1c7;font-size:10px}.note,.disclosure{font-size:12px;line-height:1.7;color:#9eafc3;margin-top:22px}.disclosure{background:#111a2a;border:1px solid var(--line);border-radius:12px;padding:18px}.error{padding:60px 20px;text-align:center;color:var(--muted)}footer{padding:25px 0;border-top:1px solid #ffffff16;color:#8392a7;font-size:12px}
@media(max-width:760px){.layout{grid-template-columns:1fr;gap:18px}.visual{min-height:280px}.visual img{height:280px}.panel{padding:20px}.title{font-size:25px}main{padding-top:25px}}
</style>
</head>
<body>
<header><div class="shell nav"><a class="logo" href="/">Tech<span>Kjop</span></a><a class="back" href="/">← Back to catalogue</a></div></header>
<main class="shell"><div class="crumb"><a href="/">Home</a> / Product comparison</div><div id="product"><div class="error">Loading product details…</div></div></main>
<footer><div class="shell">© 2026 TechKjop · Independent technology discovery and affiliate website.</div></footer>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const validTracked=o=>o&&o.affiliate===true&&o.url&&(o.trackingVerified===true||String(o.url).includes("campid="))&&Number(o.price)>0;
const money=(n,c)=>Number(n).toLocaleString("nb-NO",{style:"currency",currency:c||"NOK",maximumFractionDigits:2});
function historyMarkup(rows,productId){
 const matching=rows.filter(x=>x.productId===productId);
 const groups=new Map();
 for(const row of matching){const key=[row.merchant,row.currency,row.condition].join("|");if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row)}
 const charts=[];
 for(const [key,values] of groups){
  const points=values.sort((a,b)=>a.date.localeCompare(b.date));
  const dates=[...new Set(points.map(x=>x.date))];
  if(dates.length<2)continue;
  const nums=points.map(x=>Number(x.price)).filter(Number.isFinite);
  if(nums.length<2)continue;
  const min=Math.min(...nums),max=Math.max(...nums),range=Math.max(max-min,1);
  const coords=points.map((x,i)=>{const px=24+(i/(points.length-1))*552;const py=138-((Number(x.price)-min)/range)*112;return px.toFixed(1)+","+py.toFixed(1)}).join(" ");
  charts.push('<div><div class="merchant">'+esc(points[0].merchant)+' · '+esc(points[0].currency)+' · '+esc(points[0].condition)+'</div><svg class="historyChart" viewBox="0 0 600 165" role="img" aria-label="Verified daily price history"><path d="M24 138H576" stroke="#35465e" stroke-width="1"/><polyline fill="none" stroke="#c5f36b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="'+coords+'"/><circle cx="'+coords.split(" ").at(-1).split(",")[0]+'" cy="'+coords.split(" ").at(-1).split(",")[1]+'" r="5" fill="#65d9e8"/></svg><div class="historyLegend"><span>'+esc(dates[0])+'</span><span>Latest: '+esc(money(points[points.length-1].price,points[0].currency))+'</span><span>'+esc(dates[dates.length-1])+'</span></div></div>');
 }
 return charts.length?charts.join(""):'<p>Price history will appear after at least two verified daily price observations from the same merchant. No historical prices are being invented or estimated.</p>';
}
async function load(){
 const box=document.getElementById("product");
 const id=new URLSearchParams(location.search).get("id");
 if(!id){box.innerHTML='<div class="error">Product not found. <a href="/">Return to TechKjop</a></div>';return}
 try{
  const [catalogueResponse,historyResponse]=await Promise.all([
   fetch("/products.json",{cache:"no-store"}),
   fetch("/price-history.json",{cache:"no-store"}).catch(()=>null)
  ]);
  if(!catalogueResponse.ok)throw Error("catalogue unavailable");
  const products=await catalogueResponse.json();
  const product=products.find(x=>String(x.id)===id);
  if(!product)throw Error("product not found");
  const offers=(product.offers||[]).filter(validTracked);
  if(!offers.length)throw Error("no valid tracked offer");
  let usdNok=null;
  if(offers.some(o=>o.currency==="USD"&&!Number.isFinite(Number(o.priceNok)))){
   try{const fx=await fetch("https://open.er-api.com/v6/latest/USD");const data=await fx.json();if(data.result==="success")usdNok=Number(data.rates?.NOK)}catch(_){}
  }
  const comparable=o=>Number.isFinite(Number(o.priceNok))?Number(o.priceNok):o.currency==="NOK"?Number(o.price):o.currency==="USD"&&usdNok?Number(o.price)*usdNok:Number.POSITIVE_INFINITY;
  offers.sort((a,b)=>comparable(a)-comparable(b));
  const best=offers[0];
  const bestNok=comparable(best);
  const review=product.priceReview?'<div class="reviewFlag">'+esc(product.priceReviewReason||"Price check recommended. Compare the exact model and condition before purchase.")+'</div>':"";
  const offerCards=offers.map(o=>{
   const country=String(o.country||"").toUpperCase();
   const delivery=o.shippingToNorwayVerified===true
    ?(o.shippingCostKnown===true?(Number(o.shipping)===0?"Norway delivery · free standard shipping":"Norway delivery · shipping "+money(o.shipping,o.currency)):"Norway delivery available · shipping cost not supplied")
    :"Norway delivery not verified";
   const stock=o.inStock===true?"In stock":o.inStock===false?"Out of stock":"Stock status not supplied";
   const condition=o.condition||"Condition not supplied";
   const converted=(o.currency==="USD"&&comparable(o)!==Number.POSITIVE_INFINITY)?'<div class="converted">≈ '+esc(money(comparable(o),"NOK"))+' · indicative conversion only</div>':"";
   const source=country==="NO"?"Norwegian retailer":"eBay US / international marketplace";
   return '<article class="offer"><div class="offerTop"><div><div class="merchant">'+esc(o.store||"Marketplace seller")+'</div><div class="meta"><span class="pill">'+esc(source)+'</span><span class="pill">'+esc(condition)+'</span><span class="pill">'+esc(stock)+'</span></div></div><div><div class="price">'+esc(money(o.price,o.currency))+'</div>'+converted+'</div></div><div class="shipping">'+esc(delivery)+'</div><a class="cta" href="'+esc(o.url)+'" target="_blank" rel="nofollow sponsored noopener">Visit '+esc(o.store||"seller")+' listing ↗</a></article>';
  }).join("");
  const history=historyResponse&&historyResponse.ok?await historyResponse.json().catch(()=>[]):[];
  document.title=product.name+" | TechKjop";
  box.innerHTML='<div class="layout"><div class="visual"><img src="'+esc(product.image)+'" alt="'+esc(product.name)+'" onerror="this.style.opacity=.15"></div><section class="panel"><div class="category">'+esc(product.category||"Tech product")+' · '+esc(product.marketplace||"Marketplace listings")+'</div><h1 class="title">'+esc(product.name)+'</h1>'+review+'<p class="desc">'+esc(product.description||"Compare the seller offers and confirm product specifications before buying.")+'</p><div class="bestPrice"><small>Lowest comparable offer</small><strong>'+esc(money(best.price,best.currency))+'</strong><span>'+(bestNok!==Number.POSITIVE_INFINITY?'≈ '+esc(money(bestNok,"NOK"))+' using available currency conversion · not a landed price':'Compare seller currency and final checkout total')+'</span></div><h2>Compare seller offers ('+offers.length+')</h2><div class="offers">'+offerCards+'</div></section></div><section class="history"><h2>Verified price history</h2>'+historyMarkup(Array.isArray(history)?history:[],String(product.id))+'</section><p class="note">Before ordering, verify exact model specifications, item condition, seller feedback, stock, delivery cost, VAT/import charges, return terms and final checkout price. A currency conversion is not a Norwegian retail price and does not include delivery or taxes.</p><div class="disclosure"><strong>Affiliate disclosure:</strong> TechKjop may earn a commission from qualifying purchases made through selected links, at no additional cost to you. TechKjop is not the seller and does not control marketplace listings.</div>';
 }catch(e){box.innerHTML='<div class="error">This listing is not available right now. <a href="/">Return to TechKjop</a></div>'}
}
load();
</script>
</body>
</html>
