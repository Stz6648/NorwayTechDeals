<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Laptops | TechKjop</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111}
header{background:#111827;padding:18px 24px}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{color:#fff;font-size:25px;font-weight:700;text-decoration:none}
.logo span{color:#3b82f6}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{color:#d1d5db;text-decoration:none;font-size:14px}
nav a:hover{color:#fff}

.hero{background:#fff;text-align:center;padding:42px 20px;border-bottom:1px solid #e5e7eb}
.hero h1{margin:0 0 10px;font-size:38px}
.hero p{margin:0;color:#6b7280}

.container{max-width:1200px;margin:35px auto;padding:0 20px}
.title{font-size:26px;margin-bottom:22px}

.products{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:14px;
overflow:hidden;
box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.image{
height:240px;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:#fff;
}

.image img{
max-width:100%;
max-height:205px;
object-fit:contain;
}

.content{padding:20px}
.badge{
display:inline-block;
background:#fee2e2;
color:#b91c1c;
padding:5px 9px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-bottom:10px;
}

h2{font-size:20px;margin:0 0 10px}
.description{color:#6b7280;font-size:14px;line-height:1.5;margin-bottom:14px}

.specs{
font-size:14px;
line-height:1.8;
color:#374151;
margin-bottom:15px;
}

.price{font-size:24px;font-weight:bold;margin-top:10px}

.best{
margin-top:10px;
padding:10px;
background:#eef6ef;
border-radius:8px;
font-size:14px;
}

.offers{margin-top:12px}
.offer{
display:flex;
justify-content:space-between;
font-size:13px;
padding:6px 0;
border-bottom:1px solid #eee;
}

.button{
display:block;
margin-top:16px;
padding:13px;
background:#111827;
color:white;
text-align:center;
text-decoration:none;
border-radius:9px;
font-weight:bold;
}

.button:hover{background:#2563eb}

@media(max-width:900px){
.products{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
.nav{flex-direction:column;align-items:flex-start}
.products{grid-template-columns:1fr}
.hero h1{font-size:30px}
}
</style>
</head>

<body>

<header>
<div class="nav">
<a href="/" class="logo">Tech<span>Kjop</span></a>
<nav>
<a href="/">Home</a>
<a href="/gaming-laptops.html">Gaming Laptops</a>
<a href="/gaming-pc.html">Gaming PC</a>
<a href="/graphics-cards.html">Graphics Cards</a>
<a href="/ram.html">RAM</a>
<a href="/laptop-tilbud.html">Laptop Deals</a>
</nav>
</div>
</header>

<section class="hero">
<h1>Gaming Laptops</h1>
<p>Compare gaming laptop prices from Norwegian retailers.</p>
</section>

<main class="container">
<div class="title">Gaming Laptop Deals</div>
<div id="products" class="products"></div>
</main>

<script>
async function loadProducts(){

const response=await fetch("/products.json");
const products=await response.json();

const laptops=products.filter(p=>p.category==="Laptop");

const container=document.getElementById("products");

laptops.forEach(product=>{

const specs=product.specifications || {};
const offers=product.offers || [];

const sortedOffers=[...offers].sort((a,b)=>a.price-b.price);
const best=sortedOffers[0];

const offersHTML=sortedOffers.map(o=>`
<div class="offer">
<span>${o.store}</span>
<strong>${Number(o.price).toLocaleString("nb-NO")} NOK</strong>
</div>
`).join("");

container.innerHTML+=`

<article class="card">

<div class="image">
<img src="${product.image}" alt="${product.name}">
</div>

<div class="content">

<span class="badge">GAMING LAPTOP</span>

<h2>${product.name}</h2>

<div class="description">
${product.description || ""}
</div>

<div class="specs">
🔥 ${specs.cpu || ""}<br>
🎮 ${specs.gpu || ""}<br>
💾 ${specs.ram || ""}<br>
💿 ${specs.storage || ""}<br>
🖥️ ${specs.screen || ""}
</div>

<div class="price">
From ${Number(best.price).toLocaleString("nb-NO")} NOK
</div>

<div class="best">
Best price: <strong>${best.store}</strong>
</div>

<div class="offers">
${offersHTML}
</div>

<a class="button"
href="${best.url}"
target="_blank"
rel="noopener noreferrer">
View Best Deal
</a>

</div>
</article>
`;
});

}

loadProducts();
</script>

</body>
</html>
