<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Laptops – Compare Prices | TechKjop</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#111;
}
header{
    background:#111827;
    padding:18px 24px;
}
.nav{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}
.logo{
    color:white;
    font-size:25px;
    font-weight:700;
    text-decoration:none;
}
.logo span{color:#3b82f6}
nav{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
}
nav a{
    color:#d1d5db;
    text-decoration:none;
    font-size:14px;
}
nav a:hover{color:white}

.hero{
    background:white;
    padding:45px 20px 35px;
    text-align:center;
    border-bottom:1px solid #e5e7eb;
}
.hero h1{
    margin:0 0 10px;
    font-size:38px;
}
.hero p{
    margin:0 auto;
    max-width:700px;
    color:#6b7280;
    font-size:16px;
}

.container{
    max-width:1200px;
    margin:35px auto;
    padding:0 20px;
}
.section-title{
    font-size:25px;
    margin-bottom:22px;
}

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px;
}

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
    display:flex;
    flex-direction:column;
}
.image-wrap{
    height:230px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#fff;
}
.image-wrap img{
    max-width:100%;
    max-height:190px;
    object-fit:contain;
}
.card-body{
    padding:20px;
    display:flex;
    flex-direction:column;
    flex:1;
}
.badge{
    display:inline-block;
    width:max-content;
    background:#fee2e2;
    color:#b91c1c;
    font-size:12px;
    font-weight:700;
    padding:5px 9px;
    border-radius:999px;
    margin-bottom:10px;
}
.card h3{
    margin:0 0 10px;
    font-size:19px;
    line-height:1.3;
}
.description{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
    margin-bottom:14px;
}
.specs{
    font-size:13px;
    line-height:1.8;
    color:#374151;
    margin-bottom:15px;
}
.price{
    font-size:23px;
    font-weight:700;
    margin-top:auto;
}
.best-store{
    margin-top:10px;
    background:#eef6ef;
    padding:10px;
    border-radius:8px;
    font-size:13px;
}
.button{
    display:block;
    text-align:center;
    background:#111827;
    color:white;
    text-decoration:none;
    padding:13px;
    border-radius:9px;
    margin-top:14px;
    font-weight:700;
}
.button:hover{background:#2563eb}

.loading{
    text-align:center;
    padding:50px;
    color:#6b7280;
}

@media(max-width:900px){
    .products{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
    .nav{
        flex-direction:column;
        align-items:flex-start;
    }
    nav{gap:12px}
    .hero h1{font-size:30px}
    .products{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="nav">
<a href="/" class="logo">Tech<span>Kjop</span></a>

<nav>
<a href="/">Home</a>
<a href="/gaming-laptops.html">Gaming Laptops</a>
<a href="/gaming-pc.html">Gaming PC</a>
<a href="/graphics-cards.html">Graphics Cards</a>
<a href="/ram.html">RAM</a>
<a href="/laptop-tilbud.html">Laptop Deals</a>
</nav>
</div>
</header>

<section class="hero">
<h1>Gaming Laptops</h1>
<p>Compare gaming laptops, specifications and prices from different retailers.</p>
</section>

<main class="container">
<h2 class="section-title">Gaming Laptop Deals</h2>
<div id="products" class="products">
<div class="loading">Loading gaming laptops...</div>
</div>
</main>

<script>
function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

async function loadProducts(){
    const container=document.getElementById("products");

    try{
        const response=await fetch("/products.json");

        if(!response.ok) throw new Error("Failed to load products");

        const products=await response.json();

        const laptops=products.filter(p=>{
            const text=(
                (p.name||"")+" "+
                (p.description||"")+" "+
                (p.cpu||"")+" "+
                (p.gpu||"")
            ).toLowerCase();

            return text.includes("laptop") ||
                   text.includes("notebook");
        });

        if(!laptops.length){
            container.innerHTML="<div class='loading'>No gaming laptops available yet.</div>";
            return;
        }

        container.innerHTML="";

        laptops.forEach(product=>{
            const offers=Array.isArray(product.offers)
                ? product.offers.filter(o=>o && o.price)
                : [];

            offers.sort((a,b)=>{
                const pa=parseFloat(String(a.price).replace(/[^\d.,]/g,"").replace(/\./g,"").replace(",","."));
                const pb=parseFloat(String(b.price).replace(/[^\d.,]/g,"").replace(/\./g,"").replace(",","."));
                return pa-pb;
            });

            const lowest=offers[0];

            let priceText="Price coming soon";

            if(lowest){
                priceText="From "+escapeHtml(lowest.price)+" NOK";
            }

            const card=document.createElement("article");
            card.className="card";

            card.innerHTML=`
                <div class="image-wrap">
                    <img
                        src="${escapeHtml(product.image || "/images/gaming-laptop.jpg")}"
                        alt="${escapeHtml(product.name || "Gaming Laptop")}"
                        loading="lazy"
                        onerror="this.src='/images/gaming-laptop.jpg';"
                    >
                </div>

                <div class="card-body">

                    <span class="badge">GAMING LAPTOP</span>

                    <h3>${escapeHtml(product.name || "Gaming Laptop")}</h3>

                    <div class="description">
                        ${escapeHtml(product.description || "Gaming laptop for high-performance gaming.")}
                    </div>

                    <div class="specs">
                        ${product.cpu ? "🔥 "+escapeHtml(product.cpu)+"<br>" : ""}
                        ${product.gpu ? "🎮 "+escapeHtml(product.gpu)+"<br>" : ""}
                        ${product.ram ? "💾 "+escapeHtml(product.ram)+"<br>" : ""}
                        ${product.storage ? "💿 "+escapeHtml(product.storage)+"<br>" : ""}
                        ${product.screen ? "🖥️ "+escapeHtml(product.screen) : ""}
                    </div>

                    <div class="price">${priceText}</div>

                    ${
                        lowest
                        ? `
                        <div class="best-store">
                            Best price:
                            <strong>${escapeHtml(lowest.store || "Retailer")}</strong>
                        </div>

                        <a
                            class="button"
                            href="${escapeHtml(lowest.url || "#")}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            View Best Deal
                        </a>
                        `
                        : ""
                    }

                </div>
            `;

            container.appendChild(card);
        });

    }catch(error){
        console.error(error);
        container.innerHTML="<div class='loading'>Unable to load gaming laptops.</div>";
    }
}

loadProducts();
</script>

</body>
</html>
