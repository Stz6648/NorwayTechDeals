name: Update Products

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: product-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      AWIN_ACER_FEED_URL: ${{ secrets.AWIN_ACER_FEED_URL }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      PROSHOP_FEED_URL: ${{ secrets.PROSHOP_FEED_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run safety tests
        run: npm test

      - name: Run product update
        run: node update-products.js

      - name: Open catalog update pull request
        if: ${{ success() }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/catalog-refresh
          base: main
          add-paths: |
            products.json
            public/products.json
            ebay-products.json
          title: "Review refreshed product catalog"
          body: "Automated catalog update. Safety tests and catalog validation passed; review the generated catalog diff before merging."
