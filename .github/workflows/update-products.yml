name: Update Products

on:
  push:
    branches:
      - codex/catalog-refresh
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID || '5339206505' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run product update
        run: node update-products.js

      - name: Save changes
        run: |
          git config user.name "TechKjop Bot"
          git config user.email "actions@github.com"
          git add products.json public/products.json ebay-products.json
          git diff --cached --quiet || git commit -m "Automatic product update"
          git push
