name: Update Products

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      AWIN_ACER_FEED_URL: ${{ secrets.AWIN_ACER_FEED_URL }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run product update
        run: node update-products.js

      - name: Save changes
        run: |
          git config user.name "TechKjop Bot"
          git config user.email "actions@github.com"
          git add products.json public/products.json
          git diff --cached --quiet || git commit -m "Automatic product update"
          git push
