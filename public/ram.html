<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAM tilbud i Norge | Techkjop</title>
<meta name="description" content="Sammenlign RAM og DDR5 RAM priser i Norge.">

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:white;text-align:center;padding:35px 20px}
header h1{margin:0 0 8px}
main{max-width:1200px;margin:30px auto;padding:0 20px}
.intro{background:white;padding:20px;border-radius:12px;margin-bottom:25px}
.deals-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.deals-tools{display:flex;gap:10px}
.deals-tools input,.deals-tools select{padding:10px;border:1px solid #ddd;border-radius:8px}
.deals-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:20px}
.deal-card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px}
.deal-card img{width:100%;height:190px;object-fit:contain;background:#f7f7f7;border-radius:10px}
.deal-card h3{font-size:18px;margin:12px 0}
.specs{color:#555;font-size:14px}
.price{font-size:24px;font-weight:bold;margin:12px 0}
.store{color:#666}
.button{display:inline-block;margin-top:12px;padding:10px 16px;background:#111;color:white;border-radius:8px;text-decoration:none}
</style>
</head>

<body>

<header>
<h1>RAM tilbud i Norge</h1>
<p>Sammenlign RAM-priser og DDR5 RAM.</p>
</header>

<main>

<div class="intro">
<h2>RAM Deals</h2>
<p>Finn RAM til gaming-PC og andre PC-er. Sammenlign kapasitet, hastighet og pris.</p>
</div>

<div class="deals-head">
<h2>🔥 RAM Deals</h2>
<div class="deals-tools">
<input id="dealSearch" placeholder="Søk RAM...">
<select id="dealSort">
<option value="recommended">Anbefalt</option>
<option value="price-low">Laveste pris</option>
<option value="price-high">Høyeste pris</option>
</select>
</div>
</div>

<div id="ramDeals" class="deals-grid">
<p>Laster RAM...</p>
</div>

</main>

<script>
async function loadRAMDeals(){
const container=document.getElementById("ramDeals");

try{
const response=await fetch("/products.json?"+Date.now());
if(!response.ok) throw new Error();

const data=await response.json();
let products=Array.isArray(data)?data:(data.products||data.items||[]);

products=products.filter(p=>{
const c=String(p.category||"").toLowerCase();
return c==="ram"||c==="memory";
});

const search=document.getElementById("dealSearch");
const sort=document.getElementById("dealSort");

function price(p){
return Number(p.lowestPrice??p.price??p.offers?.[0]?.price??999999);
}

function render(){
let list=[...products];
const q=search.value.toLowerCase().trim();

if(q){
list=list.filter(p=>JSON.stringify(p).toLowerCase().includes(q));
}

if(sort.value==="price-low") list.sort((a,b)=>price(a)-price(b));
if(sort.value==="price-high") list.sort((a,b)=>price(b)-price(a));

if(!list.length){
container.innerHTML="<p>Ingen RAM funnet.</p>";
return;
}

container.innerHTML=list.map(p=>{
const name=p.name||"RAM";
const image=p.image||"/images/ram.jpg";
const specs=p.specifications||{};
const ram=specs.ram||"";
const type=specs.type||"";
const speed=specs.speed||"";
const latency=specs.latency||"";
const store=p.lowestStore||p.offers?.[0]?.store||"Proshop";
const link=p.offers?.[0]?.url||p.url||"#";

return `
<article class="deal-card">
<img src="${image}" alt="${name}" loading="lazy">
<h3>${name}</h3>
<div class="specs">
${ram}<br>
${type} · ${speed} · ${latency}
</div>
<div class="price">${store.toLowerCase().includes("ebay") ? `${Math.round(price(p) / 9.3)} USD ≈ ${price(p).toLocaleString("nb-NO")} NOK` : `${price(p).toLocaleString("nb-NO")} kr`}</div>
<div class="store">${store}</div>
<a class="button" href="${link}" target="_blank" rel="noopener">Se tilbud</a>
</article>
`;
}).join("");
}

search.addEventListener("input",render);
sort.addEventListener("change",render);
render();

}catch(e){
container.innerHTML="<p>Kunne ikke laste RAM.</p>";
}
}

loadRAMDeals();
</script>

</body>
</html>
