<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grafikkort tilbud i Norge | TechKjop</title>

  <meta name="description" content="Browse recommended NVIDIA GeForce RTX and AMD Radeon graphics cards with merchant offers at TechKjop.">

  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://www.norwaytechdeals.no/graphics-cards.html">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      line-height: 1.7;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    header p {
      margin: 0;
      font-size: 18px;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    section {
      background: white;
      padding: 30px;
      margin-bottom: 25px;
      border-radius: 10px;
    }

    h2 {
      margin-top: 0;
      font-size: 27px;
    }

    h3 {
      font-size: 21px;
    }

    ul {
      padding-left: 25px;
    }

    a {
      color: #0066cc;
    }

    .back {
      text-align: center;
      margin: 35px 0;
    }
  </style>

<style>
.deals-wrap{margin:40px auto;max-width:1200px}
.deals-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.deals-tools{display:flex;gap:10px}
.deals-tools input,.deals-tools select{padding:12px;border:1px solid #ddd;border-radius:8px}
.deals-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:25px}
.deal-card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.deal-card img{width:100%;height:190px;object-fit:contain;border-radius:10px;background:#f7f7f7}
.deal-card h3{font-size:19px;margin:14px 0 8px}
.deal-specs{color:#555;line-height:1.6;font-size:14px}
.best-price{font-size:24px;font-weight:700;margin:12px 0}
.store{color:#666;font-size:14px}
.deal-button{display:inline-block;margin-top:12px;padding:10px 16px;background:#111;color:#fff;border-radius:8px;text-decoration:none}
.no-results{padding:30px;text-align:center;color:#666}
</style>

</head>

<body>

<header>
  <h1>eBay graphics card recommendations</h1>
  <p>Browse featured NVIDIA GeForce and AMD Radeon graphics card listings on eBay.</p>
</header>

<main>

  <section>
  <h2>Explore graphics cards</h2>
  <p>Explore graphics cards and merchant offers.</p>
</section>

    <div class="back">
    <a href="/">← Tilbake til TechKjop</a>
  </div>


<section class="deals-wrap">
  <div class="deals-head">
    <h2>🔥 Graphics Card Deals</h2>
    <div class="deals-tools">
      <input id="dealSearch" type="text" placeholder="Search GPU, RTX, Radeon...">
      <select id="dealSort">
        <option value="recommended">Recommended</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
  </div>
  <div id="gpuDeals" class="deals-grid">
    <div class="no-results">Loading graphics card deals...</div>
  </div>
</section>

</main>


<script>
async function loadGPUDeals() {
  const container = document.getElementById("gpuDeals");

  try {
    const response = await fetch("/products.json", {cache:"no-store"});
    if (!response.ok) throw new Error("Could not load products");

    let data = await response.json();
    let products = Array.isArray(data)
      ? data
      : (data.products || data.items || []);

    products = products.filter(p => {
      if (!p || typeof p !== "object") return false;
      const category = String(p.category || "").toLowerCase();
      return category === "graphics card" ||
             category === "gpu";
    });

    const search = document.getElementById("dealSearch");
    const sort = document.getElementById("dealSort");

    function price(p) {
      return Number(
        p.offers?.[0]?.price ?? p.price ??
        999999
      );
    }

    function render() {
      let list = [...products];
      const q = search.value.trim().toLowerCase();

      if (q) {
        list = list.filter(p =>
          JSON.stringify(p).toLowerCase().includes(q)
        );
      }

      if (sort.value === "name") list.sort((a,b) => (a.name||"").localeCompare(b.name||""));

      if (!list.length) {
        container.innerHTML =
          '<div class="no-results">No graphics cards found.</div>';
        return;
      }

      container.innerHTML = list.map(p => {
        const name = p.name || p.title || "Graphics Card";
        const image = p.image || p.imageUrl || "/images/gpu.jpg";
        const gpu = p.gpu || p.graphics || name;
        const vram = p.vram || p.memory || "VRAM not listed";
        const store = p.lowestStore || p.lowest_store ||
                      p.store || p.merchant || p.shop ||
                      p.offers?.[0]?.store || p.store || "Merchant";

        const currentPrice = price(p);
        const currency = p.offers?.[0]?.currency || p.currency || "";
        const priceText = currentPrice < 999999 && currency
          ? `${currentPrice.toLocaleString("en-US")} ${currency}` : "See price at merchant";

        const link = p.offers?.[0]?.url || p.url || p.link || p.productUrl || "#";

        return `
          <article class="deal-card">
            <img src="${image}" alt="${name}" loading="lazy" onerror="this.onerror=null;this.src='/images/techkjop-placeholder.svg'">
            <h3>${name}</h3>
            <div class="deal-specs">
              <div>GPU: ${gpu}</div>
              <div>VRAM: ${vram}</div>
            </div>
            <div class="best-price">${priceText}</div>
            <div class="store">Merchant · ${store}</div>
            <a class="deal-button" href="${link}" target="_blank" rel="${p.offers?.[0]?.affiliate === true ? 'nofollow sponsored noopener' : 'nofollow noopener'}">
              View Deal
            </a>
          </article>
        `;
      }).join("");
    }

    search.addEventListener("input", render);
    sort.addEventListener("change", render);
    render();

  } catch (error) {
    container.innerHTML =
      '<div class="no-results">Unable to load deals right now.</div>';
  }
}

loadGPUDeals();
</script>

</body>
</html>
