<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Laptop tilbud i Norge | TechKjop</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}
header{background:#111827;color:white;padding:18px 20px}
.header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}
.logo{font-size:26px;font-weight:800;color:white;text-decoration:none}
nav{display:flex;gap:16px;flex-wrap:wrap}
nav a{color:#ddd;text-decoration:none;font-size:14px}
.hero{background:white;padding:40px 20px}
.hero-inner{max-width:1200px;margin:auto}
.hero h1{font-size:36px;margin:0 0 10px}
.hero p{color:#667085}
.controls{max-width:1200px;margin:25px auto;padding:0 20px;display:flex;gap:12px}
input,select{padding:13px;border:1px solid #ddd;border-radius:8px;font-size:15px}
input{flex:1}
.grid{max-width:1200px;margin:auto;padding:0 20px 50px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:white;border:1px solid #e1e5ea;border-radius:14px;overflow:hidden}
.card-image{height:240px;padding:15px;background:white}
.card-image img{width:100%;height:100%;object-fit:contain}
.card-body{padding:18px}
.card h2{font-size:19px;margin:0 0 8px}
.desc{color:#667085;font-size:14px;margin-bottom:12px}
.specs{font-size:13px;line-height:1.7;color:#465164}
.price{font-size:23px;font-weight:800;margin-top:16px}
.store{font-size:13px;color:#667085;margin:5px 0 15px}
.button{display:block;background:#111827;color:white;text-align:center;padding:12px;border-radius:8px;text-decoration:none;font-weight:bold}
.status{text-align:center;padding:40px;color:#667085}
footer{background:#111827;color:#ccc;padding:30px;text-align:center}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.header{flex-direction:column;align-items:flex-start}.controls{flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<div class="header">
<a class="logo" href="/">TechKjop</a>
<nav>
<a href="/">Home</a>
<a href="/gaming-laptops.html">Gaming Laptop</a>
<a href="/gaming-pc.html">Gaming PC</a>
<a href="/graphics-cards.html">Graphics Cards</a>
<a href="/ram.html">RAM</a>
<a href="/laptop-tilbud.html">Laptop Deals</a>
</nav>
</div>
</header>

<section class="hero">
<div class="hero-inner">
<h1>Gaming Laptop tilbud i Norge</h1>
<p>Sammenlign gaming-laptoper, priser og spesifikasjoner.</p>
</div>
</section>

<div class="controls">
<input id="search" placeholder="Søk etter gaming laptop...">
<select id="sort">
<option value="default">Anbefalt</option>
<option value="low">Pris: lavest først</option>
<option value="high">Pris: høyest først</option>
<option value="name">Navn A–Å</option>
</select>
</div>

<div id="status" class="status">Laster gaming-laptoper...</div>
<div id="products" class="grid"></div>

<footer>© 2026 TechKjop</footer>

<script>
let products=[];

function getPrice(p){
if(p.lowestPrice!=null)return Number(p.lowestPrice);
if(p.price!=null)return Number(p.price);
if(p.offers?.length){
const prices=p.offers.map(o=>Number(o.price)).filter(n=>!isNaN(n));
if(prices.length)return Math.min(...prices);
}
return 999999;
}

function money(n){
if(n>=999999)return "Pris mangler";
return n.toLocaleString("nb-NO")+" NOK";
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function render(){

const q=document.getElementById("search").value.toLowerCase();
const sort=document.getElementById("sort").value;

let list=products.filter(p=>{
const text=JSON.stringify(p).toLowerCase();
return text.includes(q);
});

if(sort==="low")list.sort((a,b)=>getPrice(a)-getPrice(b));
if(sort==="high")list.sort((a,b)=>getPrice(b)-getPrice(a));
if(sort==="name")list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","no"));

const box=document.getElementById("products");

if(!list.length){
box.innerHTML="";
document.getElementById("status").textContent="Ingen gaming-laptoper funnet.";
return;
}

document.getElementById("status").style.display="none";

box.innerHTML=list.map(p=>{

const s=p.specifications||{};
const image=p.image||"/images/lenovo-loq.jpg";
const name=p.name||"Gaming Laptop";
const price=getPrice(p);
const store=p.lowestStore||p.offers?.[0]?.store||"";
const link="product.html?id="+encodeURIComponent(p.id);

return `
<article class="card">

<div class="card-image">
<img src="${esc(image)}"
alt="${esc(name)}"
loading="lazy">
</div>

<div class="card-body">

<h2>${esc(name)}</h2>

<div class="desc">
${esc(p.description||"Gaming laptop")}
</div>

<div class="specs">
${s.cpu?`CPU: ${esc(s.cpu)}<br>`:""}
${s.gpu?`GPU: ${esc(s.gpu)}<br>`:""}
${s.ram?`RAM: ${esc(s.ram)}<br>`:""}
${s.storage?`Lagring: ${esc(s.storage)}<br>`:""}
${s.screen?`Skjerm: ${esc(s.screen)}`:""}
</div>

<div class="price">${money(price)}</div>

${store?`<div class="store">Beste pris hos ${esc(store)}</div>`:""}

<a class="button" href="${link}">
Se beste tilbud
</a>

</div>
</article>
`;
}).join("");
}

async function load(){

try{

const response=await fetch("/products.json?"+Date.now());

if(!response.ok)throw new Error();

const data=await response.json();

products=data.filter(p=>
p.category==="Laptop" ||
p.category==="Gaming Laptop"
);

render();

}catch(e){

document.getElementById("status").textContent=
"Kunne ikke laste produkter.";

}
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("sort").addEventListener("change",render);

load();
</script>

</body>
</html>
