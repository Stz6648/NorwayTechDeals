<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Laptop tilbud i Norge | TechKjop</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fa;
  color:#172033;
}
header{
  background:#111827;
  color:white;
  padding:18px 20px;
}
.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
.logo{
  font-size:26px;
  font-weight:800;
  color:white;
  text-decoration:none;
}
nav{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
}
nav a{
  color:#ddd;
  text-decoration:none;
  font-size:14px;
}
nav a:hover{color:white}

.hero{
  background:white;
  padding:40px 20px;
}
.hero-inner{
  max-width:1200px;
  margin:auto;
}
.hero h1{
  margin:0 0 10px;
  font-size:36px;
}
.hero p{
  color:#667085;
  margin:0;
}

.controls{
  max-width:1200px;
  margin:25px auto;
  padding:0 20px;
  display:flex;
  gap:12px;
}
.search{
  flex:1;
  padding:14px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}
.sort{
  padding:14px;
  border:1px solid #ddd;
  border-radius:8px;
  background:white;
}

.grid{
  max-width:1200px;
  margin:0 auto 50px;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  display:flex;
  flex-direction:column;
}

.image-box{
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
  padding:15px;
}
.image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.content{
  padding:18px;
}
.title{
  font-size:18px;
  font-weight:700;
  line-height:1.35;
  margin-bottom:12px;
}
.specs{
  color:#667085;
  font-size:14px;
  line-height:1.7;
  min-height:70px;
}
.price{
  font-size:25px;
  font-weight:800;
  margin-top:12px;
}
.store{
  color:#667085;
  font-size:14px;
  margin:5px 0 15px;
}

.offer-title{
  font-weight:700;
  margin-top:18px;
  margin-bottom:8px;
}

.offer{
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:10px;
  margin-top:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.offer-name{
  font-size:14px;
  font-weight:600;
}
.offer-price{
  font-weight:700;
}
.offer a{
  display:inline-block;
  background:#111827;
  color:white;
  padding:8px 12px;
  border-radius:6px;
  text-decoration:none;
  font-size:13px;
  white-space:nowrap;
}

.ebay{
  margin-top:10px;
}
.ebay-loading{
  color:#888;
  font-size:13px;
}
.ebay-offer{
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px;
  margin-top:8px;
}
.ebay-offer a{
  display:block;
  background:#111827;
  color:white;
  text-align:center;
  padding:9px;
  border-radius:6px;
  text-decoration:none;
  margin-top:8px;
  font-size:13px;
}

.no-results{
  max-width:1200px;
  margin:40px auto;
  padding:20px;
  text-align:center;
  color:#667085;
}

footer{
  background:#111827;
  color:#aaa;
  text-align:center;
  padding:30px 20px;
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .header{flex-direction:column;align-items:flex-start}
  .grid{grid-template-columns:1fr}
  .controls{flex-direction:column}
  .hero h1{font-size:28px}
}
</style>
</head>

<body>

<header>
  <div class="header">
    <a class="logo" href="/">TechKjop</a>

    <nav>
      <a href="/">Home</a>
      <a href="/gaming-laptops.html">Gaming Laptop</a>
      <a href="/gaming-pc.html">Gaming PC</a>
      <a href="/graphics-cards.html">Graphics Cards</a>
      <a href="/ram.html">RAM</a>
      <a href="/laptop-tilbud.html">Laptop Deals</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Gaming Laptop tilbud i Norge</h1>
    <p>Sammenlign gaming-laptop, priser og spesifikasjoner.</p>
  </div>
</section>

<div class="controls">
  <input
    id="search"
    class="search"
    type="text"
    placeholder="Søk etter gaming laptop..."
  >

  <select id="sort" class="sort">
    <option value="recommended">Anbefalt</option>
    <option value="price-low">Laveste pris</option>
    <option value="price-high">Høyeste pris</option>
  </select>
</div>

<main id="grid" class="grid"></main>

<div id="status" class="no-results">Laster gaming laptops...</div>

<footer>
  © 2026 TechKjop.no
</footer>

<script>
let products = [];
let usdToNok = 9.44;

fetch("https://open.er-api.com/v6/latest/USD")
  .then(r => r.json())
  .then(data => {
    if (data?.rates?.NOK > 0) {
      usdToNok = data.rates.NOK;
    }
  })
  .catch(() => {});
const imageMap = {
  "lenovo-loq-15": "/images/lenovo-loq.jpg",
  "asus-rog-strix-g16": "/images/asus-rog-g16.jpg",
  "gigabyte-gaming-laptop": "/images/gigabyte-gaming.jpg"
};

function getImage(product){
  return imageMap[product.id] || product.image || product.imageUrl || "/images/lenovo-loq.jpg";
}

function getPrice(product){
  if(typeof product.lowestPrice === "number") return product.lowestPrice;
  if(typeof product.price === "number") return product.price;

  const prices = (product.offers || [])
    .map(o => Number(o.price))
    .filter(p => Number.isFinite(p) && p > 0);

  return prices.length ? Math.min(...prices) : 0;
}

function getStore(product){
  if(product.lowestStore) return product.lowestStore;

  if(product.offers && product.offers.length){
    return product.offers[0].store || product.offers[0].merchant || "Nettbutikk";
  }

  return "";
}

function getSpecs(product){
  const s = product.specifications || {};

  const values = [];

  if(s.cpu) values.push("CPU: " + s.cpu);
  if(s.gpu) values.push("GPU: " + s.gpu);
  if(s.ram) values.push("RAM: " + s.ram);
  if(s.storage) values.push("Lagring: " + s.storage);
  if(s.screen) values.push("Skjerm: " + s.screen);

  if(product.ram) values.push("RAM: " + product.ram);
  if(product.storage) values.push("Lagring: " + product.storage);
  if(product.screen) values.push("Skjerm: " + product.screen);

  return [...new Set(values)].slice(0,5);
}

function formatPrice(price, currency="NOK"){
  if(!Number.isFinite(Number(price))) return "";
  return new Intl.NumberFormat("nb-NO",{
    minimumFractionDigits:0,
    maximumFractionDigits:2
  }).format(Number(price)) + " " + currency;
}

function getOffers(product){
  if(Array.isArray(product.offers)) return product.offers;
  return [];
}

function render(){
  const grid = document.getElementById("grid");
  const status = document.getElementById("status");

  const query = document.getElementById("search").value.toLowerCase().trim();
  const sort = document.getElementById("sort").value;

  let list = products.filter(p => {
    const category = String(p.category || "").toLowerCase();

    const isLaptop =
      category === "laptop" ||
      category === "gaming laptop" ||
      category.includes("gaming laptop");

    const text = JSON.stringify(p).toLowerCase();

    return isLaptop && (!query || text.includes(query));
  });

  if(sort === "price-low"){
    list.sort((a,b) => getPrice(a) - getPrice(b));
  }

  if(sort === "price-high"){
    list.sort((a,b) => getPrice(b) - getPrice(a));
  }

  grid.innerHTML = "";

  if(!list.length){
    status.textContent = "Ingen gaming laptops funnet.";
    status.style.display = "block";
    return;
  }

  status.style.display = "none";

  list.forEach((product,index) => {

    const price = getPrice(product);
    const store = getStore(product);
    const specs = getSpecs(product);
    const offers = getOffers(product);

    const card = document.createElement("article");
    card.className = "card";

    card.innerHTML = `
      <div class="image-box">
        <img
          src="${getImage(product)}"
          alt="${product.name || "Gaming Laptop"}"
          onerror="this.onerror=null;this.src='/images/lenovo-loq.jpg';"
        >
      </div>

      <div class="content">

        <div class="title">
          ${product.name || "Gaming Laptop"}
        </div>

        <div class="specs">
          ${specs.length
            ? specs.map(x => `<div>${x}</div>`).join("")
            : "<div>Spesifikasjoner kommer</div>"
          }
        </div>

        ${
          price
          ? `<div class="price">${formatPrice(price)}</div>`
          : ""
        }

        ${
          store
          ? `<div class="store">Beste pris hos ${store}</div>`
          : ""
        }

        ${
          offers.length
          ? `
            <div class="offer-title">Norske butikker</div>

            ${offers.map(o => {

              const offerPrice = Number(o.price);
              const offerStore = o.store || o.merchant || "Nettbutikk";
              const offerUrl = o.url || o.link || o.affiliateUrl || "#";

const offerCurrency =
  String(o.currency || "").toUpperCase();

const isEbay =
  String(offerStore).toLowerCase().includes("ebay") ||
  offerCurrency === "USD";

const nokPrice =
  isEbay && Number.isFinite(offerPrice)
    ? offerPrice * usdToNok
    : offerPrice;

const priceHTML =
  isEbay && Number.isFinite(offerPrice)
    ? `${offerPrice.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })} USD ≈ ${nokPrice.toLocaleString("nb-NO", {
        maximumFractionDigits: 0
      })} NOK`
    : Number.isFinite(offerPrice)
      ? formatPrice(offerPrice)
      : "";

return `
  <div class="offer">
    <div>
      <div class="offer-name">${offerStore}</div>
      ${
        priceHTML
          ? `<div class="offer-price">${priceHTML}</div>`
          : ""
      }
    </div>

                  ${
                    offerUrl !== "#"
                    ? `<a href="${offerUrl}" target="_blank" rel="nofollow sponsored">Se tilbud</a>`
                    
                    : ""
                  }
                  <a href="product.html?id=${encodeURIComponent(product.id)}"
                     class="product-details">
                    Se detaljer
                  </a>
                </div>
              `;
            }).join("")}
          `
          : ""
        }

        <div class="offer-title">eBay</div>

        <div class="ebay" id="ebay-${index}">
          <div class="ebay-loading">Laster eBay tilbud...</div>
        </div>

      </div>
    `;

    grid.appendChild(card);

    loadEbay(product,index);
  });
}

async function loadEbay(product,index){

  const box = document.getElementById("ebay-" + index);

  if(!box) return;

  const name = product.name || "gaming laptop";

  try{

    const response = await fetch(
      "/api/ebay-search?q=" + encodeURIComponent(name)
    );

    if(!response.ok){
      throw new Error("eBay API error");
    }

    const data = await response.json();

    const items =
      data.items ||
      data.itemSummaries ||
      data.results ||
      [];

    if(!Array.isArray(items) || !items.length){
      box.innerHTML = `
        <div class="ebay-loading">
          Ingen eBay tilbud funnet.
        </div>
      `;
      return;
    }

    const bestItems = items.slice(0,3);

    box.innerHTML = bestItems.map(item => {

      const title = item.title || "eBay Gaming Laptop";

      const price =
        item.price?.value ??
        item.price ??
        "";

      const currency = item.price?.currency ?? "USD";
      const usdPrice = Number(price);
      const nokPrice = Math.round(usdPrice * 9.3);

      const url =
        item.itemWebUrl ||
        item.itemAffiliateWebUrl ||
        item.url ||
        "#";

      return `
        <div class="ebay-offer">

          <div class="offer-name">
            ${title}
          </div>

          ${
            price !== ""
            ? `<div class="offer-price">
                ${formatPrice(usdPrice, "USD")} ≈ ${formatPrice(nokPrice, "NOK")}
              </div>`
            : ""
          }

          ${
            url !== "#"
            ? `<a
                href="${url}"
                target="_blank"
                rel="nofollow sponsored"
              >
                Se på eBay
              </a>`
            : ""
          }

        </div>
      `;

    }).join("");

  }catch(error){

    box.innerHTML = `
      <div class="ebay-loading">
        eBay tilbud kunne ikke lastes akkurat nå.
      </div>
    `;

  }
}

async function loadProducts(){

  const status = document.getElementById("status");

  try{

    const response = await fetch(
      "/products.json?t=" + Date.now()
    );

    if(!response.ok){
      throw new Error("products.json error");
    }

    products = await response.json();

    render();

  }catch(error){

    status.textContent =
      "Kunne ikke laste produkter.";

    console.error(error);
  }
}

document.getElementById("search")
  .addEventListener("input",render);

document.getElementById("sort")
  .addEventListener("change",render);

loadProducts();
</script>

</body>
</html>
