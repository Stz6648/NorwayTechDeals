<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming PC tilbud i Norge | TechKjop</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}
header{background:#111827;color:white;padding:18px 20px}
.header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}
.logo{font-size:26px;font-weight:800;color:white;text-decoration:none}
nav{display:flex;gap:16px;flex-wrap:wrap}
nav a{color:#ddd;text-decoration:none;font-size:14px}
.hero{background:white;padding:40px 20px}
.hero-inner{max-width:1200px;margin:auto}
.hero h1{margin:0 0 10px;font-size:36px}
.hero p{color:#667085;margin:0}
.controls{max-width:1200px;margin:25px auto;padding:0 20px;display:flex;gap:12px}
.search{flex:1;padding:14px;border:1px solid #ddd;border-radius:8px;font-size:15px}
.sort{padding:14px;border:1px solid #ddd;border-radius:8px;background:white}
.grid{max-width:1200px;margin:0 auto 50px;padding:0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.image-box{height:230px;display:flex;align-items:center;justify-content:center;padding:15px}
.image-box img{width:100%;height:100%;object-fit:contain}
.content{padding:18px}
.title{font-size:18px;font-weight:700;line-height:1.35;margin-bottom:12px}
.specs{color:#667085;font-size:14px;line-height:1.7}
.price{font-size:25px;font-weight:800;margin-top:12px}
.store{color:#667085;font-size:14px;margin:5px 0 15px}
.offer-title{font-weight:700;margin-top:18px;margin-bottom:8px}
.offer{border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin-top:8px}
.offer-name{font-size:14px;font-weight:600}
.offer-price{font-weight:700;margin-top:4px}
.offer a{display:block;background:#111827;color:white;text-align:center;padding:9px;border-radius:6px;text-decoration:none;margin-top:8px;font-size:13px}
.loading{color:#888;font-size:13px}
.status{text-align:center;padding:30px;color:#667085}
footer{background:#111827;color:#aaa;text-align:center;padding:30px}

@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
.header{flex-direction:column;align-items:flex-start}
.grid{grid-template-columns:1fr}
.controls{flex-direction:column}
.hero h1{font-size:28px}
}
</style>
</head>

<body>

<header>
<div class="header">
<a class="logo" href="/">TechKjop</a>
<nav>
<a href="/">Home</a>
<a href="/gaming-laptops.html">Gaming Laptop</a>
<a href="/gaming-pc.html">Gaming PC</a>
<a href="/graphics-cards.html">Graphics Cards</a>
<a href="/ram.html">RAM</a>
<a href="/laptop-tilbud.html">Laptop Deals</a>
</nav>
</div>
</header>

<section class="hero">
<div class="hero-inner">
<h1>Gaming PC tilbud i Norge</h1>
<p>Sammenlign Gaming PC priser, spesifikasjoner og butikker.</p>
</div>
</section>

<div class="controls">
<input id="search" class="search" placeholder="Søk etter Gaming PC...">
<select id="sort" class="sort">
<option value="recommended">Anbefalt</option>
<option value="price-low">Laveste pris</option>
<option value="price-high">Høyeste pris</option>
</select>
</div>

<main id="grid" class="grid"></main>
<div id="status" class="status">Laster Gaming PC...</div>

<footer>© 2026 TechKjop.no</footer>

<script>
let products=[];

function price(p){
if(typeof p.lowestPrice==="number")return p.lowestPrice;
if(typeof p.price==="number")return p.price;
const x=(p.offers||[]).map(o=>Number(o.price)).filter(x=>x>0);
return x.length?Math.min(...x):0;
}

function image(p){
return p.image||p.imageUrl||"/images/lenovo-legion-t5.jpg";
}

function specs(p){
const s=p.specifications||{};
let a=[];
if(s.cpu)a.push("CPU: "+s.cpu);
if(s.gpu)a.push("GPU: "+s.gpu);
if(s.ram)a.push("RAM: "+s.ram);
if(s.storage)a.push("Lagring: "+s.storage);
if(s.screen)a.push("Skjerm: "+s.screen);
return a.slice(0,5);
}

function money(n,c="NOK"){
return new Intl.NumberFormat("nb-NO").format(Number(n))+" "+c;
}

function render(){
const grid=document.getElementById("grid");
const q=document.getElementById("search").value.toLowerCase();
const sort=document.getElementById("sort").value;

let list=products.filter(p=>{
const c=String(p.category||"").toLowerCase();
const isPC=
c.includes("gaming pc")||
c==="pc"||
c.includes("desktop")||
c.includes("gaming desktop");
return isPC&&(!q||JSON.stringify(p).toLowerCase().includes(q));
});

if(sort==="price-low")list.sort((a,b)=>price(a)-price(b));
if(sort==="price-high")list.sort((a,b)=>price(b)-price(a));

grid.innerHTML="";

if(!list.length){
document.getElementById("status").textContent="Ingen Gaming PC funnet.";
return;
}

document.getElementById("status").style.display="none";

list.forEach((p,i)=>{
const card=document.createElement("article");
const offers=Array.isArray(p.offers)?p.offers:[];

card.className="card";

card.innerHTML=`
<div class="image-box">
<img src="${image(p)}"
alt="${p.name||"Gaming PC"}"
onerror="this.onerror=null;this.src='/images/lenovo-legion-t5.jpg';">
</div>

<div class="content">

<div class="title">${p.name||"Gaming PC"}</div>

<div class="specs">
${specs(p).map(x=>`<div>${x}</div>`).join("")}
</div>

${price(p)?`<div class="price">${money(price(p))}</div>`:""}

${p.lowestStore?`<div class="store">Beste pris hos ${p.lowestStore}</div>`:""}

<div class="offer-title">Norske butikker</div>

${offers.length?offers.map(o=>`
<div class="offer">
<div class="offer-name">${o.store||o.merchant||"Nettbutikk"}</div>
${o.price?`<div class="offer-price">${money(o.price)}</div>`:""}
${o.url||o.link||o.affiliateUrl?
`<a href="${o.url||o.link||o.affiliateUrl}" target="_blank" rel="nofollow sponsored">Se tilbud</a>`:""}
</div>
`).join(""):"<div class='loading'>Ingen norske tilbud registrert.</div>"}
${p.id ? `
<a href="/product.html?id=${encodeURIComponent(p.id)}"
   class="product-details">
  Se detaljer
</a>
` : ""}

<div class="offer-title">eBay</div>

<div id="ebay-${i}" class="loading">Laster eBay tilbud...</div>

</div>`;

grid.appendChild(card);
loadEbay(p,i);
});
}

async function loadEbay(p,i){
const box=document.getElementById("ebay-"+i);
const name=p.name||"Gaming PC";

try{
const r=await fetch("/api/ebay-search?q="+encodeURIComponent(name));
if(!r.ok)throw new Error();

const data=await r.json();
const items=data.items||data.itemSummaries||data.results||[];

if(!items.length){
box.textContent="Ingen eBay tilbud funnet.";
return;
}

box.innerHTML=items.slice(0,3).map(x=>{
const title=x.title||"eBay Gaming PC";
const value=x.price?.value??x.price??"";
const currency=x.price?.currency||"USD";
const url=x.itemAffiliateWebUrl||x.itemWebUrl||x.url||"#";

return `
<div class="offer">
<div class="offer-name">${title}</div>
${value!==""?`<div class="offer-price">${money(value,currency)}</div>`:""}
${url!=="#"?
`<a href="${url}" target="_blank" rel="nofollow sponsored">Se på eBay</a>`:""}
</div>`;
}).join("");

}catch(e){
box.textContent="eBay tilbud kunne ikke lastes.";
}
}

async function load(){
try{
const r=await fetch("/products.json?t="+Date.now());
products=await r.json();
render();
}catch(e){
document.getElementById("status").textContent="Kunne ikke laste produkter.";
}
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("sort").addEventListener("change",render);

load();
</script>

</body>
</html>
