<script>

async function searchProducts() {
    const q = document.getElementById("searchInput").value.trim();
    const container = document.getElementById("products");
    const status = document.getElementById("searchStatus");
    if (!q) { status.textContent = "Enter a product name to search."; return; }
    status.textContent = "Searching products…";
    try {
        const response = await fetch("/products.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Could not load products");
        const products = await response.json();
        const matches = products.filter(p => JSON.stringify(p).toLowerCase().includes(q.toLowerCase()));
        if (!matches.length) {
          const searchResponse = await fetch("/api/ebay-search?q=" + encodeURIComponent(q));
          const searchData = await searchResponse.json();
          if (!searchResponse.ok) throw new Error(searchData.error || "eBay search is unavailable");
          const items = Array.isArray(searchData.itemSummaries) ? searchData.itemSummaries : [];
          if (!items.length) { status.textContent = `No eBay products found for “${q}”.`; container.innerHTML = ""; return; }
          status.textContent = `eBay results for “${q}”`;
          container.innerHTML = items.map(item => {
            const name = item.title || "eBay product";
            const amount = item.price?.value;
            const currency = item.price?.currency || "";
            const url = item.itemAffiliateWebUrl || item.itemWebUrl || "";
            const image = item.image?.imageUrl || "/images/techkjop-placeholder.svg";
            const price = amount && currency ? `${escapeHtml(amount)} ${escapeHtml(currency)}` : "Check current price on eBay";
            return `<article class="card"><img src="${escapeHtml(image)}" alt="${escapeHtml(name)}" onerror="this.onerror=null;this.src='/images/techkjop-placeholder.svg'"><h2>${escapeHtml(name)}</h2><p>${price}</p><p>${escapeHtml(item.condition || "")}</p><p>Confirm delivery and availability on eBay.</p>${url ? `<a class="button" href="${escapeHtml(url)}" target="_blank" rel="${item.itemAffiliateWebUrl ? 'nofollow sponsored noopener' : 'nofollow noopener'}">View on eBay</a>` : ""}</article>`;
          }).join("");
          return;
        }
        status.textContent = matches.length ? `${matches.length} product${matches.length === 1 ? "" : "s"} found.` : `No products found for “${q}”.`;
            container.innerHTML = matches.map(p => {
          const offer = (p.offers || []).find(o => o && /^https?:\/\//i.test(o.url || ""));
          const price = offer && Number(offer.price) > 0 && offer.currency
            ? `${escapeHtml(offer.price)} ${escapeHtml(offer.currency)}` : "Check price with merchant";
          return `<article class="card"><img src="${escapeHtml(p.image || "/images/techkjop-placeholder.svg")}" alt="${escapeHtml(p.name)}" onerror="this.onerror=null;this.src='/images/techkjop-placeholder.svg'"><h2>${escapeHtml(p.name)}</h2><p>${price}</p><p>${escapeHtml(offer?.store || p.store || "")}</p>${offer ? `<a class="button" href="${escapeHtml(offer.url)}" target="_blank" rel="${offer.affiliate === true ? 'nofollow sponsored noopener' : 'nofollow noopener'}">View Deal</a>` : ""}</article>`;
        }).join("");
    } catch (error) {
        status.textContent = "Unable to search products right now.";
        container.innerHTML = "";
    }
}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function loadProducts() {

    const container =
        document.getElementById("products");

    try {

        const response = await fetch(
            "/products.json",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {

            throw new Error(
                "products.json could not be loaded. HTTP " +
                response.status
            );

        }

        const products =
            await response.json();

        container.innerHTML = "";

        if (
            !Array.isArray(products) ||
            products.length === 0
        ) {

            container.innerHTML =
                "<p>No products available yet.</p>";

            return;
        }

        products.forEach(function(product) {

            const card =
                document.createElement("div");

            card.className = "card";

            let offers =
              Array.isArray(product.offers)
                ? product.offers
                    .filter(function (offer) { return offer && /^https?:\/\//i.test(offer.url || "") && (offer.store || offer.merchant); })
                    .sort(function (a, b) {
                      return (
                        Number(a.price) -
                        Number(b.price)
                      );
                     })
                 : [];

            if (
              offers.length === 0 &&
              Number(product.price) > 0 && product.currency
            ) {
              offers = [
                {
                  price: Number(product.price),
                  store: product.store || "",
                  currency: product.currency || "",
                  url: product.url || ""
                 }
               ];
            }

            const lowestOffer =
                offers.length > 0
                    ? offers[0]
                    : null;

            const lowestPrice =
                lowestOffer
                    ? Number(lowestOffer.price)
                    : null;

            const image =
                product.image ||
                "/images/techkjop-placeholder.svg";

            let offersHTML = "";

            if (offers.length > 0) {

                offersHTML =
                    '<div class="offers">';

                offers.forEach(function(
                    offer,
                    index
                ) {

                    const storeName =
                        offer.store || "Store";

                    const amount = Number(offer.price);
                    const price = Number.isFinite(amount) && amount > 0 && offer.currency
                      ? new Intl.NumberFormat("en", { style: "currency", currency: offer.currency }).format(amount)
                      : "See price at merchant";

                    const url =
                        offer.url || "#";

                    offersHTML +=
                        '<div class="offer ' +
                        (
                            index === 0
                                ? "best"
                                : ""
                        ) +
                        '">' +

                        '<a class="offer-link" href="' +
                        url +
                        '" target="_blank" rel="' + (offer.affiliate === true ? 'nofollow sponsored noopener' : 'nofollow noopener') + '">' +

                        '<span class="offer-store">' +
                        storeName +
                        "</span>" +

                        '<span class="offer-price">' +
                        price + " " + escapeHtml(offer.currency || "") + "</span>" +

                        "</a>" +

                        "</div>";

                });

                offersHTML +=
                    "</div>";
            }

            const productName =
                product.name || "Product";

            const description =
                product.description || "";

            const cpu =
                product.cpu || "";

            const gpu =
                product.gpu || "";

            const ram =
                product.ram || "";

            const storage =
                product.storage || "";

            const screen =
                product.screen || "";

            let specsHTML = "";

            if (cpu) {
                specsHTML +=
                    cpu + "<br>";
            }

            if (gpu) {
                specsHTML +=
                    gpu + "<br>";
            }

            if (ram) {
                specsHTML +=
                    ram + "<br>";
            }

            if (storage) {
                specsHTML +=
                    storage + "<br>";
            }

            if (screen) {
                specsHTML +=
                    screen;
            }

            let priceHTML =
                "Price coming soon";

            if (lowestPrice !== null) {

                const currency = lowestOffer.currency || product.currency;
                priceHTML = currency
                    ? new Intl.NumberFormat("en", { style: "currency", currency }).format(lowestPrice) + " " + currency
                    : "See price at merchant";
            }

            let bestStoreHTML = "";

            if (lowestOffer) {

                bestStoreHTML =
                    '<div class="best-store">' +
                    "Available from: " +
                    "<strong>" +
                    (
                        lowestOffer.store ||
                        "Store"
                    ) +
                    "</strong>" +
                    "</div>";
            }

            const bestUrl =
                lowestOffer &&
                lowestOffer.url
                    ? lowestOffer.url
                    : "#";

            card.innerHTML =

                '<img src="' +
                image +
                '" alt="' +
                escapeHtml(productName) +
                '" onerror="this.style.display=\'none\'">' +


                "<h2>" +
                escapeHtml(productName) +
                "</h2>" +

                '<div class="description">' +
                escapeHtml(description) +
                "</div>" +

                '<div class="specs">' +
                specsHTML +
                "</div>" +

                '<div class="price">' +
                priceHTML +
                "</div>" +

                bestStoreHTML +

                offersHTML +

                '<div class="price-note">' +
                (lowestOffer?.updatedAt ? "Price last checked: " + escapeHtml(lowestOffer.updatedAt) + ". " : "") +
                "Check current price and availability with the merchant." +
                "</div>" +

                '<a class="button" href="' +
                bestUrl +
                '" target="_blank" rel="nofollow ' + (lowestOffer && lowestOffer.affiliate === true ? 'sponsored ' : '') + 'noopener noreferrer">' +
                "View Deal" +
                "</a>";

            container.appendChild(card);

        });

    } catch (error) {

        console.error(
            "TechKjop error:",
            error
        );

        container.innerHTML =
            '<div class="error">' +
            "<strong>Unable to load products.</strong><br><br>" +
            escapeHtml(error.message) +
            "</div>";
    }
}




</script>
