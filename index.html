<meta name="description" content="Compare the best laptop, PC, gaming, GPU and RAM deals in Norway. Find the best prices and tech deals at TechKjop.">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px 20px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.header {
    max-width: 1200px;
    margin: 0 auto 35px;
}

.header h1 {
    font-size: 42px;
    margin: 0 0 10px;
}

.header p {
    color: #666;
    font-size: 18px;
}

.products {
    max-width: 1200px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    transition: transform 0.2s, box-shadow 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.card img {
    width: 100%;
    height: 160px;
    object-fit: contain;
    border-radius: 12px;
    background: #eee;
}

.badge {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 10px;
    background: #e5483e;
    color: white;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
}

.card h2 {
    font-size: 22px;
    margin: 12px 0 8px;
}

.description {
    color: #777;
    margin-bottom: 15px;
}

.specs {
    line-height: 1.8;
    font-size: 14px;
    color: #555;
}

.price {
    margin-top: 18px;
    font-size: 28px;
    font-weight: bold;
}

.price-note {
    color: #888;
    font-size: 13px;
    margin-top: 10px;
}

.best-store {
    margin-top: 10px;
    padding: 10px 12px;
    background: #f0f8f0;
    border-radius: 8px;
    font-size: 14px;
}

.best-store strong {
    color: #16823b;
}

.savings {
    margin-top: 8px;
    color: #16823b;
    font-size: 14px;
    font-weight: bold;
}

.offers {
    margin-top: 15px;
    border-top: 1px solid #eee;
    padding-top: 12px;
}

.offer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 8px;
    margin-bottom: 3px;
    font-size: 14px;
    border-radius: 7px;
}

.offer:hover {
    background: #f5f5f5;
}

.offer-store {
    color: #555;
}

.offer-price {
    font-weight: bold;
}

.offer.best .offer-store,
.offer.best .offer-price {
    color: #16823b;
}

.offer-link {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    color: inherit;
    text-decoration: none;
}

.button {
    display: block;
    margin-top: 18px;
    padding: 13px;
    text-align: center;
    background: #111;
    color: white;
    text-decoration: none;
    border-radius: 9px;
    font-weight: bold;
}

.button:hover {
    background: #333;
}

.error {
    background: #fff0f0;
    color: #b00020;
    padding: 20px;
    border-radius: 10px;
}

.navbar {
    max-width: 1200px;
    margin: 0 auto 22px;
    background: #111;
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
}

.navbar a {
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
}

.navbar a:hover {
    color: #ff6b4a;
}

.search-box {
    max-width: 1200px;
    margin: 0 auto 22px;
    display: flex;
    gap: 10px;
}

.search-box input {
    flex: 1;
    padding: 15px 18px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

.search-box button {
    padding: 0 25px;
    border: 0;
    border-radius: 10px;
    background: #e5483e;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.categories {
    max-width: 1200px;
    margin: 0 auto 30px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}

.category {
    background: white;
    padding: 18px 12px;
    border-radius: 12px;
    text-align: center;
    text-decoration: none;
    color: #222;
    font-weight: bold;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.category:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,.10);
}

.section-title {
    max-width: 1200px;
    margin: 0 auto 18px;
    font-size: 25px;
}

.ebay-result {
    position: relative;
}

.ebay-result .badge {
    background: #0064d2;
}

.ebay-price {
    color: #16823b;
}

.ebay-condition {
    color: #666;
    font-size: 14px;
    margin-top: 8px;
}

.ebay-shipping {
    color: #555;
    font-size: 13px;
    margin-top: 6px;
}

.search-status {
    max-width: 1200px;
    margin: 0 auto 20px;
    color: #666;
    font-size: 15px;
}

@media (max-width: 900px) {
    .products {
        grid-template-columns: 1fr;
    }

    body {
        padding: 20px;
    }

    .header h1 {
        font-size: 32px;
    }
}

@media (max-width: 700px) {
    .categories {
        grid-template-columns: repeat(2, 1fr);
    }

    .navbar {
        gap: 14px;
    }

    .search-box button {
        padding: 0 15px;
    }
}
</style>
</head>

    <a href="/">TechKjop</a>
    <a href="/gaming-laptops.html">Gaming Laptops</a>
    <a href="/gaming-pc.html">Gaming PC</a>
    <a href="/graphics-cards.html">GPU</a>
    <a href="/ram.html">RAM</a>
    <a href="/laptop-tilbud.html">Laptop Deals</a>
</div>

<div class="header">
    <h1>TechKjop</h1>
    <p>Compare the best laptop and PC deals in Norway</p>
</div>

<div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="Search laptop, GPU, gaming PC, RAM..."
        onkeydown="if(event.key === 'Enter') searchProducts()"
    >
    <button onclick="searchProducts()">Search</button>
</div>

<div class="categories">
    <a class="category" href="/gaming-laptops.html">💻 Gaming Laptop</a>
    <a class="category" href="/gaming-pc.html">🖥️ Gaming PC</a>
    <a class="category" href="/graphics-cards.html">🎮 Graphics Cards</a>
    <a class="category" href="/ram.html">⚡ RAM</a>
    <a class="category" href="/laptop-tilbud.html">🔥 Laptop Deals</a>
</div>

<h2 class="section-title" id="sectionTitle">🔥 Best Tech Deals</h2>

<div class="search-status" id="searchStatus"></div>

<div class="products" id="products">
    Loading products...
</div>

<script>

async function searchProducts() {

    const q = document.getElementById("searchInput").value.trim();

    if (!q) {
        return;
    }

    const container = document.getElementById("products");
    const status = document.getElementById("searchStatus");
    const title = document.getElementById("sectionTitle");

    title.textContent = "🔎 eBay Results";

    status.textContent = "Searching eBay for: " + q;

    container.innerHTML = "<p>Searching eBay...</p>";

    try {

        const response = await fetch(
            "/api/ebay-search?q=" + encodeURIComponent(q)
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error_description ||
                data.message ||
                "eBay search failed"
            );
        }

        if (
            !data.itemSummaries ||
            data.itemSummaries.length === 0
        ) {

            container.innerHTML =
                "<p>No eBay results found.</p>";

            status.textContent =
                "No results found for: " + q;

            return;
        }

        status.textContent =
            "Showing eBay results for: " + q;
        let usdToNokRate = 9.3;

        try {
            const fxResponse = await fetch(
                "https://api.frankfurter.app/latest?from=USD&to=NOK"
            );
            const fxData = await fxResponse.json();

            if (fxData?.rates?.NOK) {
                usdToNokRate = Number(fxData.rates.NOK);
            }
        } catch (e) {
            console.warn("USD/NOK rate unavailable:", e);
        }

        container.innerHTML = data.itemSummaries.map(function(item) {

            const image =
                item.image &&
                item.image.imageUrl
                    ? item.image.imageUrl
                    : "https://via.placeholder.com/600x400?text=eBay";

            const title =
                item.title || "eBay Product";
           

            const price =
                item.price &&
                item.price.value
                    ? item.price.value
                    : "";

            const currency =
                item.price &&
                item.price.currency
                    ? item.price.currency
                    : "";

            const condition =
                item.condition || "";

            const shipping =
                item.shippingOptions &&
                item.shippingOptions[0] &&
                item.shippingOptions[0].shippingCost &&
                item.shippingOptions[0].shippingCost.value
                    ? "Shipping: " +
                      item.shippingOptions[0].shippingCost.value +
                      " " +
                      item.shippingOptions[0].shippingCost.currency
                    : "";

            const affiliateUrl =
                item.itemAffiliateWebUrl ||
                item.itemWebUrl ||
                "#";

            return `
                <div class="card ebay-result">

                    <img
                        src="${image}"
                        alt="${escapeHtml(title)}"
                        onerror="this.style.display='none'"
                    >

                    <span class="badge">eBay</span>

                    <h2>${escapeHtml(title)}</h2>

                    <div class="ebay-condition">
                        ${escapeHtml(condition)}
                    </div>

                   <div class="price ebay-price">
                       ${currency === "USD"
                           ? `$${Number(price).toFixed(2)} USD ≈ ${Math.round(Number(price) * usdToNokRate).toLocaleString("nb-NO")} NOK`
                           : `${escapeHtml(price)} ${escapeHtml(currency)}`
                       }
                   </div>

                    <div class="ebay-shipping">
                        ${escapeHtml(shipping)}
                    </div>

                    <a
                        class="button"
                        href="${affiliateUrl}"
                        target="_blank"
                        rel="nofollow sponsored noopener"
                    >
                        View on eBay
                    </a>

                </div>
            `;

        }).join("");

    } catch (error) {

        console.error("eBay search error:", error);

        status.textContent = "";

        container.innerHTML =
            '<div class="error">' +
            "<strong>eBay search failed.</strong><br><br>" +
            escapeHtml(error.message) +
            "</div>";
    }
}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function loadProducts() {

    const container =
        document.getElementById("products");

    try {

        const response = await fetch(
            "/products.json",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {

            throw new Error(
                "products.json could not be loaded. HTTP " +
                response.status
            );

        }

        const products =
            await response.json();

        container.innerHTML = "";

        if (
            !Array.isArray(products) ||
            products.length === 0
        ) {

            container.innerHTML =
                "<p>No products available yet.</p>";

            return;
        }

        products.forEach(function(product) {

            const card =
                document.createElement("div");

            card.className = "card";

            const offers =
                Array.isArray(product.offers)
                    ? product.offers
                        .filter(function(offer) {
                            return (
                                offer &&
                                Number(offer.price) > 0
                            );
                        })
                        .sort(function(a, b) {
                            return (
                                Number(a.price) -
                                Number(b.price)
                            );
                        })
                    : [];

            const lowestOffer =
                offers.length > 0
                    ? offers[0]
                    : null;

            const lowestPrice =
                lowestOffer
                    ? Number(lowestOffer.price)
                    : null;

            const highestPrice =
                offers.length > 0
                    ? Math.max.apply(
                        null,
                        offers.map(function(offer) {
                            return Number(offer.price);
                        })
                    )
                    : null;

            const savings =
                lowestPrice !== null &&
                highestPrice !== null
                    ? highestPrice - lowestPrice
                    : 0;

            const image =
                product.image ||
                "https://via.placeholder.com/600x400?text=TechKjop";

            let offersHTML = "";

            if (offers.length > 0) {

                offersHTML =
                    '<div class="offers">';

                offers.forEach(function(
                    offer,
                    index
                ) {

                    const storeName =
                        offer.store || "Store";

                    const price =
                        Number(
                            offer.price
                        ).toLocaleString("nb-NO");

                    const url =
                        offer.url || "#";

                    offersHTML +=
                        '<div class="offer ' +
                        (
                            index === 0
                                ? "best"
                                : ""
                        ) +
                        '">' +

                        '<a class="offer-link" href="' +
                        url +
                        '" target="_blank" rel="noopener noreferrer">' +

                        '<span class="offer-store">' +
                        storeName +
                        "</span>" +

                        '<span class="offer-price">' +
                        price +
                        " NOK</span>" +

                        "</a>" +

                        "</div>";

                });

                offersHTML +=
                    "</div>";
            }

            const productName =
                product.name || "Product";

            const description =
                product.description || "";

            const cpu =
                product.cpu || "";

            const gpu =
                product.gpu || "";

            const ram =
                product.ram || "";

            const storage =
                product.storage || "";

            const screen =
                product.screen || "";

            let specsHTML = "";

            if (cpu) {
                specsHTML +=
                    cpu + "<br>";
            }

            if (gpu) {
                specsHTML +=
                    gpu + "<br>";
            }

            if (ram) {
                specsHTML +=
                    ram + "<br>";
            }

            if (storage) {
                specsHTML +=
                    storage + "<br>";
            }

            if (screen) {
                specsHTML +=
                    screen;
            }

            let priceHTML =
                "Price coming soon";

            if (lowestPrice !== null) {

                priceHTML =
                    "From " +
                    lowestPrice.toLocaleString(
                        "nb-NO"
                    ) +
                    " NOK";
            }

            let bestStoreHTML = "";

            if (lowestOffer) {

                bestStoreHTML =
                    '<div class="best-store">' +
                    "Best price: " +
                    "<strong>" +
                    (
                        lowestOffer.store ||
                        "Store"
                    ) +
                    "</strong>" +
                    "</div>";
            }

            let savingsHTML = "";

            if (savings > 0) {

                savingsHTML =
                    '<div class="savings">' +
                    "Save up to " +
                    savings.toLocaleString(
                        "nb-NO"
                    ) +
                    " NOK" +
                    "</div>";
            }

            const bestUrl =
                lowestOffer &&
                lowestOffer.url
                    ? lowestOffer.url
                    : "#";

            card.innerHTML =

                '<img src="' +
                image +
                '" alt="' +
                escapeHtml(productName) +
                '" onerror="this.style.display=\'none\'">' +

                '<span class="badge">DEAL</span>' +

                "<h2>" +
                escapeHtml(productName) +
                "</h2>" +

                '<div class="description">' +
                escapeHtml(description) +
                "</div>" +

                '<div class="specs">' +
                specsHTML +
                "</div>" +

                '<div class="price">' +
                priceHTML +
                "</div>" +

                bestStoreHTML +

                savingsHTML +

                offersHTML +

                '<div class="price-note">' +
                "We compare Norwegian retailers to find the best price." +
                "</div>" +

                '<a class="button" href="' +
                bestUrl +
                '" target="_blank" rel="noopener noreferrer">' +
                "View Best Deal" +
                "</a>";

            container.appendChild(card);

        });

    } catch (error) {

        console.error(
            "TechKjop error:",
            error
        );

        container.innerHTML =
            '<div class="error">' +
            "<strong>Unable to load products.</strong><br><br>" +
            escapeHtml(error.message) +
            "</div>";
    }
}


loadProducts();

</script>
